name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: laytan/setup-odin@v2.12.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-06
      - name: Install raylib build dependencies
        run: |
          # Chrome is unrelated to this build and its package index can be inconsistent.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev
      - name: Build Tumble
        run: odin build src -out:tumble
